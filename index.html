<!DOCTYPE html>
<html>
<head>
<title>My Product Store</title>

<style>
body{
    font-family: Arial;
    margin:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
}

.card{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.buy-btn{
    display:inline-block;
    padding:10px 15px;
    background:#000;
    color:white;
    text-decoration:none;
    border-radius:5px;
}
</style>
</head>

<body>

<h1>Recommended Products</h1>

<div class="grid">

<div class="card">
<img src="IMAGE_URL">
<h3>Product Name</h3>
<p>Short Description</p>
<a class="buy-btn" href="AFFILIATE_LINK">
Buy Now
</a>
</div>

</div>

</body>
</html>
